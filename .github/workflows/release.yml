name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compilar e Compactar Binário
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          
          BINARY_NAME="housekeeper"
          ARCHIVE_NAME="housekeeper-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          # Compila o binário otimizado
          go build -ldflags="-s -w" -o $BINARY_NAME$EXT main.go
          
          # Compacta de acordo com o sistema operacional
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${{ github.workspace }}/dist/${ARCHIVE_NAME}.zip" $BINARY_NAME$EXT
          else
            tar -czf "${{ github.workspace }}/dist/${ARCHIVE_NAME}.tar.gz" $BINARY_NAME$EXT
          fi

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: housekeeper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Criar GitHub Release e Enviar Binários
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
