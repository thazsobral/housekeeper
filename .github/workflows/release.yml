name: Release

on:
  push:
    tags:
      - 'v*' # Aciona automaticamente sempre que você cria uma tag (ex: v0.0.1)

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compilar binário otimizado
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          
          BINARY_NAME="housekeeper-${{ matrix.goos }}-${{ matrix.goarch }}$EXT"
          # -ldflags="-s -w" remove informações de debug para deixar o binário menor
          go build -ldflags="-s -w" -o dist/$BINARY_NAME main.go

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: housekeeper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Criar GitHub Release e Enviar Binários
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}